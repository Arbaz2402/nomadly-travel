name: Nomadly CI Test & Build Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & In-Memory MongoDB Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Run Backend Vitest Test Suite (50 Tests)
        run: npm --prefix backend test
        env:
          NODE_ENV: test
          JWT_SECRET: nomadly_ci_super_secret_jwt_key_2026_test

  frontend-build-test:
    name: Frontend Tests & Production Bundle Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Run Frontend Vitest Test Suite (18 Tests)
        run: npm --prefix frontend test

      - name: Run Vite Production Bundle Build
        run: npm run build --prefix frontend
